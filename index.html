<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白石角 · 天賦海灣 巴士到站看板</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --card2: #1c2430;
    --line: #2a3441;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #ffd43b;
    --soon: #ff6b6b;
    --ok: #51cf66;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Helvetica Neue", sans-serif;
    padding: 16px;
    max-width: 720px;
    margin: 0 auto;
    min-height: 100vh;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 20px; font-weight: 700; }
  .clock {
    font-size: 30px; font-weight: 800; color: var(--accent);
    font-variant-numeric: tabular-nums; letter-spacing: 1px;
  }
  .sub { color: var(--muted); font-size: 12px; margin: 4px 0 14px; }

  .weather {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 14px; margin: 0 0 14px;
  }
  .wx-icon { width: 46px; height: 46px; flex-shrink: 0; }
  .wx-main { flex: 1; min-width: 0; }
  .wx-temp { font-size: 24px; font-weight: 800; color: var(--text); line-height: 1.1; }
  .wx-hum { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 8px; }
  .wx-desc { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }

  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  button {
    background: var(--card2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 14px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--accent); color: #1a1a00; border-color: var(--accent); font-weight: 600; }
  .status { font-size: 12px; color: var(--muted); margin-left: auto; text-align: right; }
  .status .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:5px; vertical-align: middle; }
  .status.loading .dot { background: var(--accent); }
  .status.error .dot { background: var(--soon); }

  .filter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .filter-label { font-size: 11px; color: var(--muted); width: 100%; margin-bottom: 2px; }
  .chip {
    padding: 6px 12px; font-size: 13px; border-radius: 20px;
    border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer;
  }
  .chip.active { background: var(--accent); color:#1a1a00; border-color: var(--accent); font-weight:600; }
  .filters-wrap { margin-bottom: 14px; }

  .section-title {
    font-size: 14px; font-weight: 700; color: var(--text);
    margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .section-title:first-of-type { margin-top: 4px; }
  .shuttle .badge.station { color: var(--accent); }
  .shuttle .dest .sched-note { color: var(--muted); font-size: 11px; }

  .route {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
  }
  /* 兩個徽章竪排，佔用最小橫向空間 */
  .badges { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; width: 76px; }
  .badge {
    text-align: center; font-size: 18px; font-weight: 800;
    padding: 6px 4px; border-radius: 9px; background: var(--card2); color: var(--accent); letter-spacing: 0.3px;
    line-height: 1.15; word-break: break-word;
  }
  .badge.station {
    color: var(--text); background: rgba(255,212,59,0.12); font-size: 13px; font-weight: 700;
  }
  .info { flex: 1; min-width: 0; }
  .dest { font-size: 15px; font-weight: 600; margin-bottom: 3px; overflow-wrap: anywhere; }
  .dest .en { color: var(--muted); font-weight: 400; font-size: 12px; }
  .meta { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .times { text-align: right; flex-shrink: 0; }
  .t-main { font-size: 24px; font-weight: 800; line-height: 1.05; white-space: nowrap; }
  .t-main .unit { font-size: 12px; font-weight: 500; color: var(--muted); }
  .t-main.soon { color: var(--soon); }
  .t-main.now { color: var(--ok); }
  /* 文字型主提示（即將到站/即將開出/尾班）縮小並允許換行，避免溢出 */
  .t-main.text { font-size: 15px; white-space: normal; line-height: 1.2; }
  .t-next { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .empty { color: var(--muted); text-align:center; padding: 30px; font-size: 14px; line-height: 1.6; }
  footer { margin-top: 20px; color: var(--muted); font-size: 11px; text-align: center; line-height: 1.6; }

  /* 窄屏（手機）微調 */
  @media (max-width: 480px) {
    body { padding: 12px; }
    h1 { font-size: 18px; }
    .clock { font-size: 26px; }
    .route { padding: 11px 12px; gap: 10px; }
    .badges { width: 68px; }
    .badge { font-size: 17px; }
    .badge.station { font-size: 12px; }
    .dest { font-size: 14px; }
    .dest .en { display: block; margin-top: 1px; }
    .t-main { font-size: 22px; }
  }
</style>
</head>
<body>
  <header><h1>🚌 巴士到站看板</h1><div class="clock" id="clock">--:--:--</div></header>
  <div class="sub">白石角 · 天賦海灣一帶 · 屋苑穿梭 + 小巴 + 九巴/城巴 實時到站</div>

  <div class="weather" id="weather">
    <img class="wx-icon" id="wxIcon" alt="" />
    <div class="wx-main">
      <div class="wx-temp"><span id="wxTemp">--</span>°<span class="wx-hum" id="wxHum"></span></div>
      <div class="wx-desc" id="wxDesc">天氣載入中…</div>
    </div>
  </div>

  <div class="toolbar">
    <button class="primary" id="refreshBtn">↻ 立即刷新</button>
    <button id="autoBtn">自動刷新：開</button>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">載入中…</span></div>
  </div>

  <div class="section-title">🏠 天賦海灣一期 屋苑穿梭巴士</div>
  <div id="shuttleList"></div>

  <div class="section-title">🚐 專線小巴 實時到站</div>
  <div id="minibusList"></div>

  <div class="section-title">🚌 九巴 / 城巴 實時到站</div>
  <div class="filters-wrap">
    <div class="filter" id="stationFilter"><span class="filter-label">上車站點</span></div>
    <div class="filter" id="routeFilter"><span class="filter-label">路線</span></div>
  </div>

  <div id="list"></div>

  <footer>
    數據來源：九巴 KMB 開放數據平台（data.etabus.gov.hk）· 僅供參考，以實際班次為準<br>
    倒數每秒更新 · 每 30 秒自動向伺服器重新拉取
  </footer>

<script>
// 每个站柱 stop ID -> 所属站点名。四站全部合并到一个看板。
const STOPS = [
  // 天賦海灣
  { id: "F3243F2A0BC4DEAD", station: "天賦海灣" }, // PA202
  { id: "261392BB77CC768D", station: "天賦海灣" }, // PA203
  { id: "4DD5EC5516B360D7", station: "天賦海灣" }, // PA204
  { id: "B4E25ABB1C5DE439", station: "天賦海灣" }, // PA205
  // 白石角
  { id: "1B1D9A9077A0827F", station: "白石角" },   // PA128
  { id: "369A5601F8A63B5E", station: "白石角" },   // PA129
  { id: "E42EE04A4E8CC11D", station: "白石角" },   // PA140
  { id: "F8F0E91589F099CD", station: "白石角" },   // PA141
  // 逸瓏灣
  { id: "5747450359C7907C", station: "逸瓏灣" },   // PA150
  // 雲滙 St Martin
  { id: "3313B37BF82AFF18", station: "雲滙" },     // PA125
  { id: "42E95A3F058750C1", station: "雲滙" },     // PA126
  { id: "79FD1B44D37205B8", station: "雲滙" },     // PA127
];
const STOP_STATION = Object.fromEntries(STOPS.map(s => [s.id, s.station]));
const STATION_ORDER = ["逸瓏灣", "天賦海灣", "白石角", "雲滙"];
// 离家由近到远的优先级：同一路線+方向在多個站出現時，只保留最近的站。
const STATION_PRIORITY = ["逸瓏灣", "天賦海灣", "白石角", "雲滙"];
const stationRank = (s) => { const i = STATION_PRIORITY.indexOf(s); return i < 0 ? 999 : i; };

const API = "https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/";
const REFRESH_MS = 30000;

let etaData = [];
let autoOn = true;
let autoTimer = null;
let filterStation = "ALL";
let filterRoute = "ALL";

const $ = (id) => document.getElementById(id);

async function fetchAll() {
  setStatus("loading", "更新中…");
  try {
    const kmb = Promise.all(
      STOPS.map(s => fetch(API + s.id).then(r => r.json()).then(j => ({ id: s.id, data: j.data })).catch(() => null))
    );
    const ctb = fetchCitybus();
    const [results, ctbEntries] = await Promise.all([kmb, ctb]);

    const merged = [];
    for (const res of results) {
      if (!res || !res.data) continue;
      for (const e of res.data) {
        e._station = STOP_STATION[res.id] || "";
        merged.push(e);
      }
    }
    for (const e of ctbEntries) merged.push(e);

    etaData = merged;
    render();
    setStatus("ok", "已更新 " + fmtClock(new Date()));
  } catch (err) {
    setStatus("error", "更新失敗，將重試");
  }
}

/* 城巴 582：白石角經大學站 往西沙。並入九巴實時列表。 */
const CTB_ETA = "https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/";
const CTB_582_STOPS = [
  { stop: "003838", station: "白石角" }, // 白石角總站
  { stop: "003736", station: "雲滙" },   // 雲滙, 創新路（往西沙方向）
];
async function fetchCitybus() {
  try {
    const arrs = await Promise.all(
      CTB_582_STOPS.map(s =>
        fetch(CTB_ETA + s.stop + "/582").then(r => r.json())
          .then(j => (j.data || []).map(e => ({ e, station: s.station }))).catch(() => [])
      )
    );
    const out = [];
    for (const arr of arrs) for (const { e, station } of arr) {
      if (!e.eta) continue;
      // 只保留「從家開出」方向；往白石角(總站)的返程進站車不顯示
      if (e.dest_tc && e.dest_tc.indexOf("白石角") >= 0) continue;
      out.push({
        route: "582", dir: e.dir, dest_tc: e.dest_tc, dest_en: e.dest_en,
        eta: e.eta, rmk_tc: e.rmk_tc || "城巴", _station: station
      });
    }
    return out;
  } catch (e) { return []; }
}

function setStatus(cls, text) {
  $("status").className = "status " + cls;
  $("statusText").textContent = text;
}
function fmtClock(d) {
  return d.toLocaleTimeString("zh-HK", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
}

// 分组键：路线 + 方向 + 上车站点（不含目的地）
// 循環線等同一班车会返回多个目的地名，时间相同，视为同一班去重。
function groupRoutes() {
  const map = new Map();
  const now = Date.now();
  for (const e of etaData) {
    if (!e.eta) continue;
    const t = new Date(e.eta).getTime();
    if (t < now - 30000) continue;
    const key = e.route + "|" + e.dir + "|" + e._station;
    if (!map.has(key)) {
      map.set(key, {
        route: e.route, dir: e.dir, dest_tc: e.dest_tc, dest_en: e.dest_en,
        station: e._station, times: [], rmk: e.rmk_tc || ""
      });
    }
    const g = map.get(key);
    // 目的地优先显示「循環線」名称，否则保留首个
    if (e.dest_tc && e.dest_tc.indexOf("循環") >= 0) { g.dest_tc = e.dest_tc; g.dest_en = e.dest_en; }
    g.times.push(t);
  }
  let arr = [...map.values()];
  for (const r of arr) { r.times.sort((a, b) => a - b); r.times = [...new Set(r.times)]; }

  // 就近去重（僅「全部站」視圖）：同一路線+方向若在多個站出現，只保留最近的站
  if (filterStation === "ALL") {
    const best = new Map();
    for (const r of arr) {
      const k = r.route + "|" + r.dir;
      const cur = best.get(k);
      if (!cur || stationRank(r.station) < stationRank(cur.station)) best.set(k, r);
    }
    arr = [...best.values()];
  }

  arr.sort((a, b) => (a.times[0] || Infinity) - (b.times[0] || Infinity));
  return arr;
}

function minsFromNow(t) { return Math.round((t - Date.now()) / 60000); }

function render() {
  const routes = groupRoutes();
  renderFilters(routes);

  const visible = routes.filter(r =>
    (filterStation === "ALL" || r.station === filterStation) &&
    (filterRoute === "ALL" || r.route === filterRoute)
  );

  const list = $("list");
  if (visible.length === 0) {
    list.innerHTML = '<div class="empty">暫無符合條件的即將到站班次<br>（深夜或非服務時間屬正常）</div>';
    return;
  }

  list.innerHTML = visible.map(r => {
    const m0 = r.times.length ? minsFromNow(r.times[0]) : null;
    let mainCls = "t-main", mainTxt;
    if (m0 === null) mainTxt = "—";
    else if (m0 <= 0) { mainCls += " now text"; mainTxt = '即將到站'; }
    else { if (m0 <= 3) mainCls += " soon"; mainTxt = m0 + '<span class="unit"> 分鐘</span>'; }

    const nextTimes = r.times.slice(1, 3).map(t => { const m = minsFromNow(t); return m <= 0 ? "即將" : m + "分"; });
    const nextTxt = nextTimes.length ? "之後：" + nextTimes.join(" · ") : "";

    return `
      <div class="route">
        <div class="badges">
          <div class="badge">${r.route}</div>
          <div class="badge station">${r.station}</div>
        </div>
        <div class="info">
          <div class="dest">往 ${r.dest_tc} <span class="en">${r.dest_en}</span></div>
          <div class="meta">${r.rmk ? r.rmk : "實時預測"}</div>
        </div>
        <div class="times">
          <div class="${mainCls}">${mainTxt}</div>
          <div class="t-next">${nextTxt}</div>
        </div>
      </div>`;
  }).join("");
}

function renderFilters(routes) {
  // 站点筛选
  const stations = STATION_ORDER.filter(s => routes.some(r => r.station === s));
  $("stationFilter").innerHTML = '<span class="filter-label">上車站點</span>'
    + '<span class="chip ' + (filterStation==="ALL"?"active":"") + '" data-s="ALL">全部</span>'
    + stations.map(s => '<span class="chip ' + (filterStation===s?"active":"") + '" data-s="' + s + '">' + s + '</span>').join("");
  $("stationFilter").querySelectorAll(".chip").forEach(c => {
    c.onclick = () => { filterStation = c.dataset.s; render(); };
  });

  // 路线筛选（随站点联动）
  const pool = routes.filter(r => filterStation === "ALL" || r.station === filterStation);
  const routeSet = [...new Set(pool.map(r => r.route))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  if (filterRoute !== "ALL" && !routeSet.includes(filterRoute)) filterRoute = "ALL";
  $("routeFilter").innerHTML = '<span class="filter-label">路線</span>'
    + '<span class="chip ' + (filterRoute==="ALL"?"active":"") + '" data-r="ALL">全部</span>'
    + routeSet.map(r => '<span class="chip ' + (filterRoute===r?"active":"") + '" data-r="' + r + '">' + r + '</span>').join("");
  $("routeFilter").querySelectorAll(".chip").forEach(c => {
    c.onclick = () => { filterRoute = c.dataset.r; render(); };
  });
}

/* ============ 天賦海灣一期 屋苑穿梭巴士（固定班表） ============ */
// 由「天賦海灣 Providence Bay」屋苑開出的時間（HH:MM）。每日相同。
// 資料來源：屋苑告示（2018-03 起實施 / 只供參考）。
const SHUTTLES = [
  // 大埔墟線：三個屋苑都可上車（很近），合併只顯示最近一班（不分上車點）
  {
    name: "大埔墟線", boarding: "天賦海灣一期", en: "Providence Bay", dest: "大埔墟",
    times: [
      "07:00","07:10","07:20","07:30","07:40","07:50",
      "08:00","08:10","08:20","08:30","08:40","08:50",
      "09:00","09:10","09:20","09:30","09:40","09:50",
      "10:00","10:10","10:20","10:30","10:40","11:00","11:50",
      "12:10","12:20","12:30","12:40","12:50",
      "13:00","13:10","13:20","13:30","13:40","13:50",
      "14:00","14:10","14:20","14:30","14:40","15:10","15:20","15:50",
      "16:00","16:10","16:20","16:30","16:40","16:50",
      "17:00","17:10","17:20","17:30","17:40","17:50",
      "18:00","18:10","18:20","18:30","18:40","18:50",
      "19:00","19:10","19:20","19:30","19:40","19:50","20:00"
    ],
  },
  {
    name: "大學站", boarding: "天賦海灣", en: "University Station", dest: "大學站",
    times: [
      "08:00","08:20","08:45","09:10","09:30","09:50","10:10","10:30",
      "10:50","11:10","11:30","11:50","12:10","12:30","12:50","13:10",
      "15:10","15:30","15:50","16:10","16:30","16:50","17:10","17:30",
      "17:50","18:10","18:30","18:50","19:10","19:30","19:50"
    ],
  },
];

function nowMinutes() {
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
}
function hm2min(s) { const [h, m] = s.split(":").map(Number); return h * 60 + m; }
function fmtHM(min) {
  const h = Math.floor(min / 60) % 24, m = Math.round(min % 60);
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
}

function renderShuttles() {
  const cur = nowMinutes();
  const rows = SHUTTLES.map(s => {
    const mins = s.times.map(hm2min).sort((a, b) => a - b);
    const upcoming = mins.filter(m => m >= cur - 0.5); // 保留 30s 缓冲
    return { s, mins, upcoming, sortKey: upcoming.length ? upcoming[0] : Infinity };
  });
  rows.sort((a, b) => a.sortKey - b.sortKey);

  const html = rows.map(({ s, mins, upcoming }) => {
    let mainCls = "t-main", mainTxt, nextTxt = "";
    if (upcoming.length === 0) {
      mainTxt = "今日已尾班";
      mainCls = "t-main text";
      const first = fmtHM(mins[0]);
      nextTxt = "明早首班 " + first;
    } else {
      const wait = Math.round(upcoming[0] - cur);
      if (wait <= 0) { mainCls += " now text"; mainTxt = "即將開出"; }
      else { if (wait <= 5) mainCls += " soon"; mainTxt = wait + '<span class="unit"> 分鐘</span>'; }
      const rest = upcoming.slice(1, 3).map(fmtHM);
      nextTxt = "開出 " + fmtHM(upcoming[0]) + (rest.length ? " · 之後 " + rest.join(" · ") : "");
    }
    return `
      <div class="route shuttle">
        <div class="badges">
          <div class="badge">${s.name}</div>
          <div class="badge station">${s.boarding}</div>
        </div>
        <div class="info">
          <div class="dest">往 ${s.dest} <span class="en">${s.en}</span></div>
          <div class="meta"><span class="sched-note">${s.boarding}開出 · 只供參考</span></div>
        </div>
        <div class="times">
          <div class="${mainCls}">${mainTxt}</div>
          <div class="t-next">${nextTxt}</div>
        </div>
      </div>`;
  }).join("");
  $("shuttleList").innerHTML = html;
}

// 顶部大时钟
function tickClock() { $("clock").textContent = fmtClock(new Date()); }
setInterval(tickClock, 1000);
tickClock();

/* ============ 天氣（香港天文台 HKO 開放數據，取大埔）============ */
const HKO_NOW = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc";
const HKO_FLW = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=tc";
const WX_REFRESH_MS = 10 * 60 * 1000; // 天氣 10 分鐘更新一次足夠

async function fetchWeather() {
  try {
    const [now, flw] = await Promise.all([
      fetch(HKO_NOW).then(r => r.json()),
      fetch(HKO_FLW).then(r => r.json()).catch(() => ({})),
    ]);
    // 温度：优先大埔，退回沙田
    const temps = (now.temperature && now.temperature.data) || [];
    let t = temps.find(x => x.place === "大埔") || temps.find(x => x.place === "沙田") || temps[0];
    $("wxTemp").textContent = t ? t.value : "--";
    // 湿度
    const hum = (now.humidity && now.humidity.data && now.humidity.data[0]);
    $("wxHum").textContent = hum ? "濕度 " + hum.value + "%" : "";
    // 天气图标（HKO 官方图标 PNG）
    const icon = (now.icon && now.icon[0]) || null;
    if (icon) { $("wxIcon").src = "https://www.hko.gov.hk/images/HKOWxIconOutline/pic" + icon + ".png"; $("wxIcon").style.display = ""; }
    else $("wxIcon").style.display = "none";
    // 今日预测简述
    const desc = flw.forecastDesc || flw.generalSituation || "";
    $("wxDesc").textContent = desc ? desc.replace(/\s+/g, "") : "暫無預測";
  } catch (e) {
    $("wxDesc").textContent = "天氣資料暫時無法載入";
  }
}
fetchWeather();
setInterval(fetchWeather, WX_REFRESH_MS);

setInterval(renderShuttles, 1000);
renderShuttles();

/* ============ 專線小巴 GMB（27A / 806A / 806B / 806C） ============ */
// "route_id|route_seq" -> 線路資訊。只列「從家開出」方向；
// 回程（往白石角/天賦海灣，即到總站進站的車）不納入。
const GMB_ROUTES = {
  "2007861|1": { code: "27A", dest: "沙田(排頭街)" },
  "2007862|1": { code: "27A", dest: "沙田(排頭街)" },
  "2007893|1": { code: "27A", dest: "沙田(排頭街)" },
  "2007894|1": { code: "27A", dest: "沙田(排頭街)" },
  "2001821|1": { code: "806A", dest: "運頭塘" },
  "2001823|1": { code: "806B", dest: "運頭塘" },
  "2001825|1": { code: "806C", dest: "運頭塘 / 科學園" },
};
// 天賦海灣一期最近的 GMB 物理站（往大埔/沙田方向上車點）
const GMB_STOPS = [
  { id: "20015841", name: "科城路交匯處" },   // 27A 總站
  { id: "20007676", name: "一期對面" },       // 創新路 天賦海灣1期對面（806 系列）
  { id: "20007683", name: "一期" },           // 創新路 天賦海灣一期
  { id: "20007097", name: "溋玥外" },         // 科進路 溋玥‧天賦海灣外
];
const GMB_ETA = "https://data.etagmb.gov.hk/eta/stop/";

let gmbData = [];

async function fetchGmb() {
  try {
    const results = await Promise.all(
      GMB_STOPS.map(s => fetch(GMB_ETA + s.id).then(r => r.json()).then(j => ({ station: s.name, data: j.data })).catch(() => null))
    );
    const merged = [];
    for (const res of results) {
      if (!res || !Array.isArray(res.data)) continue;
      for (const r of res.data) {
        const info = GMB_ROUTES[r.route_id + "|" + r.route_seq];
        if (!info) continue; // 只顯示關心的線與方向
        for (const e of (r.eta || [])) {
          if (!e.timestamp) continue;
          merged.push({ code: info.code, dest: info.dest, station: res.station, t: new Date(e.timestamp).getTime(), rmk: e.remarks_tc || "" });
        }
      }
    }
    gmbData = merged;
    renderMinibus();
  } catch (e) { /* 靜默重試 */ }
}

function renderMinibus() {
  const now = Date.now();
  const map = new Map();
  for (const e of gmbData) {
    if (e.t < now - 30000) continue;
    if (!map.has(e.code)) map.set(e.code, { code: e.code, dest: e.dest, rmk: e.rmk, entries: [] });
    map.get(e.code).entries.push({ t: e.t, station: e.station });
  }
  const arr = [...map.values()];
  for (const r of arr) {
    // 同一時間可能來自多個站，去重（保留最早出現的站名）
    r.entries.sort((a, b) => a.t - b.t);
    const seen = new Set();
    r.entries = r.entries.filter(x => seen.has(x.t) ? false : seen.add(x.t));
    r.times = r.entries.map(x => x.t);
    r.station = r.entries[0] ? r.entries[0].station : "";
  }
  arr.sort((a, b) => (a.times[0] || Infinity) - (b.times[0] || Infinity));

  const list = $("minibusList");
  if (arr.length === 0) {
    list.innerHTML = '<div class="empty">此刻小巴暫無班次資料<br>（深夜或非服務時間屬正常）</div>';
    return;
  }
  list.innerHTML = arr.map(r => {
    const m0 = r.times.length ? minsFromNow(r.times[0]) : null;
    let mainCls = "t-main", mainTxt;
    if (m0 === null) mainTxt = "—";
    else if (m0 <= 0) { mainCls += " now text"; mainTxt = "即將到站"; }
    else { if (m0 <= 3) mainCls += " soon"; mainTxt = m0 + '<span class="unit"> 分鐘</span>'; }
    const nextTimes = r.times.slice(1, 3).map(t => { const m = minsFromNow(t); return m <= 0 ? "即將" : m + "分"; });
    const nextTxt = nextTimes.length ? "之後：" + nextTimes.join(" · ") : "";
    return `
      <div class="route">
        <div class="badges">
          <div class="badge">${r.code}</div>
          <div class="badge station">${r.station}</div>
        </div>
        <div class="info">
          <div class="dest">往 ${r.dest}</div>
          <div class="meta">專線小巴 · ${r.rmk || "實時預測"}</div>
        </div>
        <div class="times">
          <div class="${mainCls}">${mainTxt}</div>
          <div class="t-next">${nextTxt}</div>
        </div>
      </div>`;
  }).join("");
}

setInterval(() => { if (gmbData.length) renderMinibus(); }, 1000);

setInterval(() => { if (etaData.length) render(); }, 1000);

function refreshAll() { fetchAll(); fetchGmb(); }

function setupAuto() {
  if (autoTimer) clearInterval(autoTimer);
  if (autoOn) autoTimer = setInterval(refreshAll, REFRESH_MS);
  $("autoBtn").textContent = "自動刷新：" + (autoOn ? "開" : "關");
  $("autoBtn").classList.toggle("primary", autoOn);
}

$("refreshBtn").onclick = refreshAll;
$("autoBtn").onclick = () => { autoOn = !autoOn; setupAuto(); };

refreshAll();
setupAuto();
</script>
